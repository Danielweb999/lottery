name: MLB 盤口快照

# 事件名稱用 odds，不要用 tick —— 樂透那個 workflow 監聽的是 tick，
# 兩個共用同一個名稱的話，樂透每跑一次就會連帶觸發這裡，
# 一天多燒好幾十點額度。
on:
  repository_dispatch:
    types: [odds]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-odds-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取盤口
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python collect.py --out snapshots

      - name: 提交
        run: |
          if [ -z "$(git status --porcelain snapshots)" ]; then
            echo "沒有新快照，不提交"
            exit 0
          fi
          git config user.name  "odds-collector"
          git config user.email "odds-collector@users.noreply.github.com"
          git add snapshots
          git commit -m "MLB 盤口快照 $(date -u '+%Y-%m-%d %H:%M')Z"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
