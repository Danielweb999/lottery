name: 每日自動更新與推播

on:
  schedule:
    # GitHub 使用 UTC 時間。
    #
    # 重要：GitHub 免費方案的排程是「盡力而為」，尖峰時段可能延後數小時，
    # 甚至整班跳過。所以不能只排幾個整點，必須密集排、靠次數彌補。
    # 因為有「期別沒變就不推播」的機制，多跑不會重複打擾——
    # 沒有新開獎的那幾十次會完全靜悄悄地結束。
    - cron: "*/15 13-17 * * *"   # 台北 21:00-01:59，每 15 分鐘一次
    - cron: "*/30 2-4 * * *"     # 台北 10:00-12:59，每 30 分鐘一次（加州）
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下

permissions:
  contents: write

concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安裝相依套件
        run: python -m pip install --quiet --upgrade certifi pillow

      - name: 更新資料庫並產生網頁
        run: |
          if [ -f lottery.db ]; then
            echo "已有資料庫，只抓最近資料（正常情況都走這條）"
            python lottery_db.py --recent --out index.html
          else
            echo "倉庫裡沒有資料庫，先抓近三年建立基礎"
            echo "（抓十年容易被來源限流又超過執行時間上限，"
            echo "  完整歷史請在本機執行「一鍵完成.bat」上傳）"
            python lottery_db.py --years 3 --out index.html
          fi

      - name: 推播開獎速報
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "尚未設定 DISCORD_WEBHOOK，略過推播"
          else
            python notify.py
          fi

      - name: 提交變更
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有新資料，不需提交"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
