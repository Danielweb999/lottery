name: 每日自動更新與推播

on:
  schedule:
    # GitHub 使用 UTC。免費方案的排程是「盡力而為」，實測會延後 2-3 小時、
    # 而且高頻率排程更容易被整批丟棄（官方文件明講）。所以這裡刻意排少一點，
    # 只保留幾個關鍵時間點，讓它比較願意執行。
    # 真正要準時，得靠外部觸發（見「準時推播說明.html」）。
    - cron: "15 13 * * *"    # 台北 21:15 — 台灣四款 20:30 開獎後
    - cron: "45 13 * * *"    # 台北 21:45
    - cron: "30 14 * * *"    # 台北 22:30 — 香港六合彩 21:30 開獎後
    - cron: "30 15 * * *"    # 台北 23:30 — 補公布較慢的
    - cron: "0 4 * * *"      # 台北 12:00 — 加州 Fantasy 5
    - cron: "0 6 * * *"      # 台北 14:00 — 補加州
  repository_dispatch:      # 外部排程服務（cron-job.org）用這個準時觸發
    types: [tick]
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下

permissions:
  contents: write

concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安裝相依套件
        run: python -m pip install --quiet --upgrade certifi pillow

      - name: 更新資料庫並產生網頁
        run: |
          if [ -f lottery.db ]; then
            echo "已有資料庫，只抓最近資料（正常情況都走這條）"
            python lottery_db.py --recent --out index.html
          else
            echo "倉庫裡沒有資料庫，先抓近三年建立基礎"
            echo "（抓十年容易被來源限流又超過執行時間上限，"
            echo "  完整歷史請在本機執行「一鍵完成.bat」上傳）"
            python lottery_db.py --years 3 --out index.html
          fi

      - name: 推播開獎速報
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "尚未設定 DISCORD_WEBHOOK，略過推播"
          else
            python notify.py
          fi

      - name: 提交變更
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有新資料，不需提交"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
