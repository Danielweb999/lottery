name: 每日自動更新與推播

on:
  schedule:
    # GitHub 自己的排程是「盡力而為」，實測會延後 2-3 小時甚至整批跳過，
    # 所以這裡只當備援。準時觸發靠外部服務（cron-job.org）打 repository_dispatch。
    - cron: "15 13 * * *"    # 台北 21:15
    - cron: "30 14 * * *"    # 台北 22:30
    - cron: "0 4 * * *"      # 台北 12:00
  repository_dispatch:      # 外部排程服務用這個準時觸發
    types: [tick]
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下

permissions:
  contents: write

# 同一時間只跑一個，後來的排隊等待。
concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v5 / v6 才是跑在 Node 24 上，用舊版會一直收到「Node.js 20 is
      # deprecated」的警告信。功能完全相同，只是換掉底層執行環境。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 這兩步是跟外部伺服器要東西，偶爾會碰到對方忙線。
      # 以前只要碰一次就整個流程失敗、寄一封失敗信給你，其實重試就好。
      - name: 安裝中文字型
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq &&             sudo apt-get install -y -qq fonts-noto-cjk &&             echo "字型安裝完成" && exit 0
            echo "字型來源忙線，10 秒後重試（第 $i 次）"
            sleep 10
          done
          echo "::warning::字型裝不起來，改用系統預設字型（圖片中文可能變方框）"
          exit 0

      - name: 安裝相依套件
        run: |
          for i in 1 2 3; do
            python -m pip install --quiet --upgrade certifi pillow && exit 0
            echo "套件來源忙線，10 秒後重試（第 $i 次）"
            sleep 10
          done
          echo "套件安裝連續失敗"
          exit 1

      - name: 更新資料庫並產生網頁
        run: |
          touch .nojekyll
          if [ -f lottery.db ]; then
            echo "已有資料庫，只抓最近資料（正常情況都走這條）"
            python lottery_db.py --recent --out index.html
          else
            echo "倉庫裡沒有資料庫，先抓近三年建立基礎"
            python lottery_db.py --years 3 --out index.html
          fi

      # 推播失敗不該讓整個流程算失敗——資料還是要照樣存檔上傳。
      - name: 推播開獎速報
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "尚未設定 DISCORD_WEBHOOK，略過推播"
          elif ! python notify.py; then
            echo "::warning::推播失敗，但資料已更新，繼續往下提交"
          fi

      - name: 提交變更
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有新資料，不需提交"
            exit 0
          fi
          git commit -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          # 多個觸發可能同時執行，推送時遠端已被別人改過就會被拒。
          # 先把遠端變更接上去再重試，不要直接失敗。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功（第 $i 次嘗試）"
              exit 0
            fi
            echo "推送被拒，先同步遠端再試（第 $i 次）"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "推送連續 5 次失敗"
          exit 1

      # 真的失敗時直接發到 Discord，附上該次執行的連結，
      # 不必再從一堆 GitHub 通知信裡面找。
      - name: 失敗時通知
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          nl = chr(10)          # 這段會被寫進 YAML，不能直接用跳脫字元
          msg = ("⚠ **雲端更新失敗**" + nl
                 + "打開下面的連結，紅色 ✘ 的那一步就是出問題的地方：" + nl
                 + os.environ["RUN_URL"])
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              json.dumps({"content": msg}).encode("utf-8"),
              {"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=30)
              print("已通知")
          except Exception as e:
              print("通知也失敗了：", e)
          PY
