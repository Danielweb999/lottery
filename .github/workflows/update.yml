name: 每日自動更新與推播

on:
  schedule:
    # GitHub 使用 UTC 時間；排程為盡力而為，可能延後 5-20 分鐘。
    # 官方公布開獎結果的時間不固定（要等銷售對帳），所以晚上每小時查一次，
    # 只有真的出現新期別才會推播，沒有就靜靜結束，不會重複打擾。
    - cron: "10 13 * * *"   # 台北 21:10 — 台灣四款 20:30 開獎後
    - cron: "10 14 * * *"   # 台北 22:10 — 香港六合彩 21:30 開獎後
    - cron: "10 15 * * *"   # 台北 23:10 — 補抓公布較慢的
    - cron: "10 16 * * *"   # 台北 00:10 — 再補一次
    - cron: "0 3 * * *"     # 台北 11:00 — 加州 Fantasy 5，順便補昨晚漏掉的
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下

permissions:
  contents: write

concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安裝相依套件
        run: python -m pip install --quiet --upgrade certifi pillow

      - name: 更新資料庫並產生網頁
        run: |
          if [ -f lottery.db ]; then
            echo "已有資料庫，只抓最近資料（正常情況都走這條）"
            python lottery_db.py --recent --out index.html
          else
            echo "倉庫裡沒有資料庫，先抓近三年建立基礎"
            echo "（抓十年容易被來源限流又超過執行時間上限，"
            echo "  完整歷史請在本機執行「一鍵完成.bat」上傳）"
            python lottery_db.py --years 3 --out index.html
          fi

      - name: 推播開獎速報
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "尚未設定 DISCORD_WEBHOOK，略過推播"
          else
            python notify.py
          fi

      - name: 提交變更
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有新資料，不需提交"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
