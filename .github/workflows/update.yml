name: 每日自動更新與推播

on:
  schedule:
    # GitHub 自己的排程是「盡力而為」，實測會延後 2-3 小時甚至整批跳過，
    # 所以這裡只當備援。準時觸發靠外部服務（cron-job.org）打 repository_dispatch。
    - cron: "15 13 * * *"    # 台北 21:15
    - cron: "30 14 * * *"    # 台北 22:30
    - cron: "0 4 * * *"      # 台北 12:00
  repository_dispatch:      # 外部排程服務用這個準時觸發
    types: [tick]
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下

permissions:
  contents: write

# 同一時間只跑一個，後來的排隊等待。
concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安裝相依套件
        run: python -m pip install --quiet --upgrade certifi pillow

      - name: 更新資料庫並產生網頁
        run: |
          touch .nojekyll
          if [ -f lottery.db ]; then
            echo "已有資料庫，只抓最近資料（正常情況都走這條）"
            python lottery_db.py --recent --out index.html
          else
            echo "倉庫裡沒有資料庫，先抓近三年建立基礎"
            python lottery_db.py --years 3 --out index.html
          fi

      - name: 推播開獎速報
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "尚未設定 DISCORD_WEBHOOK，略過推播"
          else
            python notify.py
          fi

      - name: 提交變更
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有新資料，不需提交"
            exit 0
          fi
          git commit -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          # 多個觸發可能同時執行，推送時遠端已被別人改過就會被拒。
          # 先把遠端變更接上去再重試，不要直接失敗。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功（第 $i 次嘗試）"
              exit 0
            fi
            echo "推送被拒，先同步遠端再試（第 $i 次）"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "推送連續 5 次失敗"
          exit 1
